
name: A1 Hindi Shorts Automation

on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate and publish Short
        run: python main.py
